<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusSpace - Classroom Management</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/design.css">
    <link rel="stylesheet" href="css/components.css">
    <script src="js/app.js" defer></script>
    <script src="js/admin-classrooms.js" defer></script>
    <script src="js/nav.js" defer></script>
</head>
<body data-role="admin">
    <header class="app-header">
        <img src="assets/images/logo.svg" alt="CampusSpace Logo" class="logo"/>
        <h1 class="title">CampusSpace Admin – Classroom Management</h1>
        <button class="toggle-btn" type="button" onclick="toggleSidebar()" aria-label="Toggle navigation">☰</button>
    </header>
    <aside class="sidebar" id="sidebar">
        <nav aria-label="Admin navigation">
            <ul>
                <li><a href="admin-dashboard.html">Home</a></li>
                <li><a href="admin-teachers.html">Teacher Management</a></li>
                <li><a href="admin-timetable.html">Timetable Management</a></li>
                <li><a class="active" href="admin-classrooms.html">Classroom Management</a></li>
            </ul>
        </nav>
    </aside>
    <main class="main-content">
        <section class="card">
            <h2 class="card-title">Classrooms</h2>
            <p>Manage rooms available for scheduling. A room is identified by its building, floor, and room number.</p>
            <p class="form-message" id="classroom-message" role="status" aria-live="polite"></p>
            <form id="classroom-form" class="classroom-form">
                <h3 id="classroom-form-title">Add Classroom</h3>
                <label for="classroom-building">Building</label>
                <input id="classroom-building" name="building" class="input-field" type="text" maxlength="80" required/>
                <div class="schedule-time-fields">
                    <div>
                        <label for="classroom-floor">Floor</label>
                        <input id="classroom-floor" name="floor" class="input-field" type="number" min="0" step="1" required/>
                    </div>
                    <div>
                        <label for="classroom-room-number">Room number</label>
                        <input id="classroom-room-number" name="room_number" class="input-field" type="text" maxlength="40" required/>
                    </div>
                </div>
                <label for="classroom-capacity">Capacity</label>
                <input id="classroom-capacity" name="capacity" class="input-field" type="number" min="1" step="1" required/>
                <label for="classroom-features">Features</label>
                <input id="classroom-features" name="features" class="input-field" type="text" placeholder="Projector, whiteboard (comma separated)"/>
                <div class="schedule-dialog-actions">
                    <button class="btn-secondary" type="button" id="cancel-classroom-edit" hidden>Cancel edit</button>
                    <button class="btn-primary" type="submit" id="save-classroom">Save Classroom</button>
                </div>
            </form>
        </section>
        <section class="card">
            <h2 class="card-title">Saved Classrooms</h2>
            <div id="classroom-list" aria-live="polite"></div>
        </section>
    </main>
</body>
</html>
