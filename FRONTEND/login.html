<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusSpace – Admin Login</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/design.css">
    <link rel="stylesheet" href="css/components.css">
    <script src="js/login.js" defer></script>
</head>
<body class="auth-page" data-role="guest">
    <main class="auth-container" style="max-width:400px;margin:auto;padding:var(--space-lg);">
        <div class="card" style="padding:var(--space-lg);">
            <h2 class="card-title" style="text-align:center;">Admin / Teacher Login</h2>
            <p>Demo login: username <strong>admin1</strong>, password <strong>admin1pw</strong>.</p>
            <p>Start the backend, then open this page at <strong>http://localhost:8080/login.html</strong>.</p>
            <form id="login-form">
                <label for="username">Employee ID / Username</label>
                <input type="text" id="username" class="input-field" required />
                <label for="password">Password</label>
                <input type="password" id="password" class="input-field" required />
                <button type="submit" class="btn btn-primary">Login</button>
                <p id="error-msg" style="color:var(--color-danger);display:none;margin-top:var(--space-sm);"></p>
            </form>
        </div>
    </main>
</body>
</html>
