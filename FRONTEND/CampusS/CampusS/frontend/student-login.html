<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusSpace – Student Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1>CampusSpace</h1>
    <p class="tagline">Smart Campus Resource Management &amp; Booking System</p>
  </header>

  <main class="container">
    <section class="welcome">
      <h2>Student Login</h2>
    </section>
    <section class="login-section">
      <form class="login-form" action="#" method="POST">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="student@example.com" />
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••" />
        <button type="submit" class="btn">Login</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <small>&copy; 2026 CampusSpace. All rights reserved.</small>
  </footer>
</body>
</html>
